name: Build PureLive Exo APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'android/**'
      - 'vendor/**'

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Free disk space (runner自带缓存清理, 防No space left)
        run: |
          df -h /
          rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/local/graalvm /usr/lib/google-cloud-sdk 2>/dev/null || true
          rm -rf /usr/local/lib/android/sdk/cmdline-tools 2>/dev/null || true
          sudo rm -rf /home/runner/.gradle/caches 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          df -h /

      - name: Enable Flutter Linux desktop (ensure toolchain)
        run: |
          flutter config --no-analytics
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (arm64-v8a 64-bit only)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Verify artifact
        run: |
          echo "=== 构建版本: $(git rev-parse --short HEAD) (${{ github.ref_name }}) ==="
          ls -la build/app/outputs/flutter-apk/
          ls -la build/app/outputs/flutter-apk/*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pure-live-mpv-arm64-apk
          path: build/app/outputs/flutter-apk/**/*.apk
          if-no-files-found: error
